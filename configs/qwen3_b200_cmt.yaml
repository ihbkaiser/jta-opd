_base_: qwen3_b200_base.yaml

experiment:
  method: cmt
  output_dir: outputs/cmt_opd

# Coupled Marginal Teachability uses the conditional student/teacher
# Top-K-union simplex for local selection/loss geometry, and a raw-mass
# truncated Top-K common-mass kernel for sequential accessibility.
# Exact full-vocabulary reductions are opt-in diagnostics only.
selector:
  joint_cross_scoring: true
  pgt_vocab_chunk_tokens: 2048
  # Information budget for max_w <w,L> s.t. KL(w || uniform) <= epsilon.
  # Weights retain full support and are normalized to mean one globally.
  cmt_allocation_kl: 0.5
  # Gibbs is the backward-compatible canonical allocator.  Set
  # top_fraction for the hard-selection ablation.
  cmt_allocation_mode: gibbs
  cmt_top_fraction: 0.10
  # gamma=1 is the primary finite-response estimand: no artificial time
  # preference.  Lambda exposes (rather than hides) the relative value assigned
  # to unlocking one unit of downstream local learning opportunity.
  cmt_gamma: 1.0
  cmt_successor_lambda: 1.0
  # Optional full-vocabulary diagnostic only; the training score is support
  # matched and does not pay this O(B*T*V) reduction by default.
  cmt_full_vocab_diagnostics: false
